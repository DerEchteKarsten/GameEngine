[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
core = { version = "0.1.0", path = "../core" }
glam = "0.30.5"
bevy = {version = "0.18.0", default-features = false, features = [
    "trace", 
    "detailed_trace",
    "debug",
    "wayland",
    "asset_processor", 
    "embedded_watcher", 
    "file_watcher", 
    "multi_threaded",
    "bevy_asset",
    "bevy_window",
]}

[features]
default = []
trace = ["core/trace", "bevy/trace_tracy"]

[profile.release]
debug = true
