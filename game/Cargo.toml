[package]
name = "game"
version.workspace = true
edition.workspace = true
default-run = "game"

[dependencies]
core = { version = "0.1.0", path = "../core", default-features = false }
glam = {workspace = true}
bevy = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
png = {workspace = true}

[features]
default = ["profiling", "hot-reload"]
profiling = ["core/profiling"]
hot-reload = ["core/hot-reload"]
dynamic_linking = ["core/dynamic_linking", "bevy/dynamic_linking"]
