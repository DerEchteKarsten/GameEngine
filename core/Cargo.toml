[package]
name = "core"
version.workspace = true
edition.workspace = true

[dependencies]
glam = {workspace = true}
bevy = {workspace = true}
anyhow = {workspace = true}
bytemuck = { workspace = true }

lava = { version = "0.1.0", path = "../lava", default-features = false }
lava-build-slang = { path = "../lava-build-slang", features = ["hot-reload"], optional = true }

bytemuck_derive = {workspace = true}
gltf = {workspace = true}
smallvec = {workspace = true}
meshopt = {workspace = true}
itertools = {workspace = true}
metis = {workspace = true}
rand = {workspace = true}
async-std = {workspace = true}
futures = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
tracing-log = {workspace = true}
tracing-core = {workspace = true}
fontdue = {workspace = true}
ron = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
notify = {workspace = true}
zstd = {workspace = true}
postcard = {workspace = true}
intel_tex_2 = {workspace = true}
exr = {workspace = true}
half = {workspace = true}

[features]
default = ["profiling", "hot-reload"]
# The profiler (CPU spans, GPU timings, shader clocks, its editor tab).
profiling = ["lava/profiling"]
# Shader hot reload.
hot-reload = ["dep:lava-build-slang"]
dynamic_linking = ["bevy/dynamic_linking"]

[build-dependencies]
lava-build-slang = { path = "../lava-build-slang" }
walkdir = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
