[workspace]
resolver = "3"
members = ["core", "game", "lava", "lava-build", "lava-macros", "lava-tests", "tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.99"
bytemuck = { version = "1.24.0", features = ["derive"] }
glam = { version = "0.32", features = ["bytemuck", "mint"] }
bevy = {version = "0.19.1", default-features = false, features = [
    "debug",
    "wayland",
    "embedded_watcher",
    "file_watcher",
    "multi_threaded",
    "bevy_asset",
    "bevy_window",
    "trace",
    "detailed_trace",
    "reflect_auto_register",
    "serialize"
]}
ash = "0.38.0"
ash-window = "0.13.0"
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
raw-window-handle = "0.6.2"
bytemuck_derive = "1.10.2"
gltf = "1.4.1"
smallvec = { version = "1.15.1", features = ["serde", "const_generics"] }
meshopt = "0.6.1"
itertools = "0.14.0"
metis = "0.2.2"
rand = "0.9.2"
async-std = "1.13.2"
futures = "0.3.31"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-log = "0.2"
tracing = {version = "0.1.44"}
tracing-core = {version = "0.1.36"}
fontdue = "0.9.3"
ron = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
walkdir = "2"
notify = "8.2.0"
serde_json = "1.0"
png = "0.18"
zstd = "0.13"
postcard = { version = "1", features = ["use-std"] }
intel_tex_2 = "0.5"
exr = "1.74"
half = { version = "2", features = ["bytemuck"] }

# ash 0.38 on crates.io (April 2024) predates `VK_KHR_device_address_commands`; master has it.
[patch.crates-io]
ash = { git = "https://github.com/ash-rs/ash", rev = "f4c2ca3e4f6b998d5254ad101a32f024d87cdec2" }
ash-window = { git = "https://github.com/ash-rs/ash", rev = "f4c2ca3e4f6b998d5254ad101a32f024d87cdec2" }
# gpu-allocator 0.27/0.28 use ash's old `push_next`; the `ash-next` branch builds against master.
gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator", rev = "6a68a5b4c233361c07dfa8865043a16ade7512db" }
